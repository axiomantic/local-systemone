[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-systemone"
version = "0.2.1"
description = "Universal local System One decision service & daemon supporting Laya, Ollama, and OpenAI-compatible models"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Axiomantic", email = "info@axiomantic.org" }
]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/axiomantic/local-systemone"
Repository = "https://github.com/axiomantic/local-systemone"

[project.optional-dependencies]
laya = [
    "laya==0.3.22",
]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
mcp = [
    "mcp>=1.0,<2",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
full = [
    "laya==0.3.22",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "mcp>=1.0,<2",
    "httpx>=0.27",
]

[project.scripts]
local-systemone = "systemone.server:main"
systemone = "systemone.server:main"
laya-service = "systemone.server:main"
systemone-mcp = "systemone.mcp_server:main"
laya-mcp = "systemone.mcp_server:main"
systemone-install-mcp = "systemone.install_mcp:main"
laya-install-mcp = "systemone.install_mcp:main"

[tool.setuptools]
packages = ["systemone", "laya_service"]