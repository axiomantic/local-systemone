[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-service"
version = "0.1.0"
description = "Self-hosted System One decision service + MCP server, backed by Laya"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
model = [
    "laya>=0.3.5",
]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
mcp = [
    "mcp>=1.0,<2",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
full = [
    "laya>=0.3.5",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "mcp>=1.0,<2",
    "httpx>=0.27",
]

[project.scripts]
laya-service = "laya_service.server:main"
laya-mcp = "laya_service.mcp_server:main"
laya-install-mcp = "laya_service.install_mcp:main"

[tool.setuptools]
packages = ["laya_service"]